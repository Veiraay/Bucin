<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date Invitation </title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffeef8 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-invitation {
      border: none;
      border-radius: 30px;
      box-shadow: 0 20px 45px rgba(255, 105, 180, 0.25);
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    .sticker-container {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .sticker-display {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }
    .btn-pink {
      background-color: #ff5e97;
      color: white;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      flex-grow: 1;
      transition: all 0.2s ease-in-out;
      white-space: nowrap;
    }
    .btn-pink:hover {
      background-color: #e04880;
      color: white;
    }
    .btn-gray {
      background-color: #f1f3f5;
      color: #868e96;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 12px 28px;
      flex-grow: 1;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .btn-gray:hover {
      background-color: #e9ecef;
      color: #495057;
    }
    .place-tag {
      background-color: #ffeef4;
      color: #e04880;
      border-radius: 12px;
      padding: 6px 14px;
      margin: 4px;
      font-size: 0.9rem;
      display: inline-block;
      font-weight: 600;
      border: 1px solid #ffd3e2;
    }
  </style>
</head>
<body>

  <div class="card card-invitation p-4 text-center">

    <!-- TAHAP 1: Ajakan Jalan -->
    <div id="step-1">
      <div class="sticker-container">
        <img id="sticker-step-1" src="" alt="Stiker Ajakan" class="sticker-display">
      </div>
      <h3 class="fw-bold text-dark mb-2">Hai Bebbb!</h3>
      <p id="tanya-teks" class="text-muted mb-4 px-2">Would you like to go out with me?</p>
      
      <div class="d-flex justify-content-center gap-3">
        <button id="btn-mau" class="btn btn-pink shadow-sm">Yes</button>
        <button id="btn-gamau" class="btn btn-gray">No</button>
      </div>
    </div>

    <!-- TAHAP 2: Pilih Destinasi -->
    <div id="step-2" class="d-none">
      <div class="sticker-container">
        <img id="sticker-step-2" src="" alt="Stiker Pilih Tempat" class="sticker-display">
      </div>
      <h3 class="fw-bold text-dark mb-2">Yaaay, i know bebb!</h3>
      <p class="text-muted mb-3 px-2">Is there anywhere you'd like to visit?</p>
      
      <div class="input-group mb-3">
        <input type="text" id="input-tempat" class="form-control form-control-lg rounded-start-pill" placeholder="Expl...">
        <button id="btn-tambah" class="btn btn-pink rounded-end-pill px-4">more</button>
      </div>

      <div id="list-tempat" class="mb-4 d-flex flex-wrap justify-content-center"></div>

      <button id="btn-selesai" class="btn btn-pink w-100 py-2 shadow-sm">Enough, let's get going now.</button>
    </div>

    <!-- TAHAP 3: Ending Card OTW Jemput -->
    <div id="step-3" class="d-none">
      <div class="sticker-container">
        <img id="sticker-step-3" src="" alt="Stiker OMW" class="sticker-display">
      </div>
      <h3 class="fw-bold mb-2" style="color: #e04880;">On my may bebbbbbb!</h3>
      <p class="text-muted mb-3 px-2">The place we're going to visit:</p>
      
      <div id="summary-tempat" class="mb-4"></div>

      <div class="alert alert-light border-0 shadow-sm py-3 mb-0" style="background-color: #fff0f6; border-radius: 20px;">
        <h5 class="fw-bold text-dark mb-1">Oke beby i love you!!!!</h5>
        <p class="small text-muted mb-0">I'm on my wayyy picking princess right now~</p>
      </div>
    </div>

  </div>

  <!-- Pustaka Efek Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    // ==========================================
    // DAFTAR NAMA FILE GAMBAR LOKAL KAMU
    // Sesuaikan nama filenya jika berbeda
    // ==========================================
    const listStiker = {
      // 1. Gambar Awal Tanya
      awal: "img/ajakan.jpeg",
      
      // 2, 3, 4. Tiga Gambar Saat Dia Menolak
      tolak: [
        "img/cry1.jpeg",
        "img/cry2.jpeg",
        "img/cry3.jpeg"
      ],

      // 5. Gambar Saat Memilih Tempat Tujuan
      pilihTempat: "img/jalanya.jpeg",

      // 6. Gambar Saat OTW Jemput
      jemput: "img/endd.jpeg"
    };

    // Kalimat rayuan yang berganti selaras dengan 3 stiker tolak
    const pesanNgerayu = [
      "Pleasee don't say no",
      "Pleaseeee, just one date with meee?",
      "Babyyy pleaseee, i'm begging youu!!!!"
    ];

    // Hubungkan gambar awal ke elemen HTML
    const stickerStep1 = document.getElementById("sticker-step-1");
    const stickerStep2 = document.getElementById("sticker-step-2");
    const stickerStep3 = document.getElementById("sticker-step-3");
    
    stickerStep1.src = listStiker.awal;
    stickerStep2.src = listStiker.pilihTempat;
    stickerStep3.src = listStiker.jemput;

    let indexTolak = 0;
    const daftarTempat = [];

    // Elemen DOM
    const step1 = document.getElementById("step-1");
    const step2 = document.getElementById("step-2");
    const step3 = document.getElementById("step-3");
    const btnMau = document.getElementById("btn-mau");
    const btnGamau = document.getElementById("btn-gamau");
    const tanyaTeks = document.getElementById("tanya-teks");
    const inputTempat = document.getElementById("input-tempat");
    const btnTambah = document.getElementById("btn-tambah");
    const listTempat = document.getElementById("list-tempat");
    const btnSelesai = document.getElementById("btn-selesai");
    const summaryTempat = document.getElementById("summary-tempat");

    // LOGIKA: Tombol Nggak Dulu Ditekan
    btnGamau.addEventListener("click", () => {
      const urutan = indexTolak % listStiker.tolak.length;
      
      // Ganti gambar dan teks sesuai urutan tolak (1, 2, atau 3)
      stickerStep1.src = listStiker.tolak[urutan];
      tanyaTeks.textContent = pesanNgerayu[urutan];

      // Tombol "Mau" makin lama makin membesar
      const growValue = 1 + ((indexTolak + 1) * 2);
      btnMau.style.flexGrow = growValue;

      const scaleGray = Math.max(1 - ((indexTolak + 1) * 0.2), 0.5);
      btnGamau.style.fontSize = `${scaleGray * 0.9}rem`;
      btnGamau.style.padding = `${12 * scaleGray}px ${16 * scaleGray}px`;

    if (indexTolak >= 2) {
        btnGamau.style.display = "none";
    }

      indexTolak++;
    });

    // LOGIKA: Tombol Mau Ditekan
    btnMau.addEventListener("click", () => {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        step1.classList.add("d-none");
        step2.classList.remove("d-none");
      }, 400);
    });

    // LOGIKA: Menambahkan Tempat
    function tambahDestinasi() {
      const tempat = inputTempat.value.trim();
      if (tempat !== "") {
        daftarTempat.push(tempat);

        const tag = document.createElement("span");
        tag.className = "place-tag";
        tag.textContent = `📍 ${tempat}`;
        listTempat.appendChild(tag);

        inputTempat.value = "";
        inputTempat.focus();
      }
    }

    btnTambah.addEventListener("click", tambahDestinasi);
    inputTempat.addEventListener("keypress", (e) => {
      if (e.key === "Enter") tambahDestinasi();
    });

    // LOGIKA: Selesai Memilih Tempat
    btnSelesai.addEventListener("click", () => {
      step2.classList.add("d-none");
      step3.classList.remove("d-none");

      if (daftarTempat.length > 0) {
        summaryTempat.innerHTML = daftarTempat
          .map(t => `<span class="place-tag">📍 ${t}</span>`)
          .join(" ");
      } else {
        summaryTempat.innerHTML = `<span class="text-muted fst-italic">No worries, sweatheart, I'll choose a place for our date that you're going to like</span>`;
      }
    });
  </script>
</body>
</html>
